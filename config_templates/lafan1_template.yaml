# LAFAN1 BVH Data Source Configuration Template
#
# LAFAN1 is a motion capture dataset stored in BVH format.
# BVH files contain skeleton hierarchy, bone names, and per-frame
# joint rotations/positions.
#
# Usage (solve + audit in one command):
#   .venv/bin/python scripts/retarget_and_audit.py --source config_templates/lafan1_template.yaml \
#     --robot-config robot_models/unitree_g1/unitree_g1_lafan1.json --out /path/to/run_dir
# Or solve only:
#   .venv/bin/python -m omniretargeting.main --source-config config_templates/lafan1_template.yaml \
#     --robot-config robot_models/unitree_g1/unitree_g1_lafan1.json --output output.npz
# LAFAN1 needs its own G1 profile (bone names and T-pose); the solver defaults to fast.

# Required: Data source type
type: lafan1

# Required: Path to LAFAN1 BVH motion file
motion: /path/to/lafan1/motion.bvh

# Optional: Path to terrain mesh file
# If not specified, a flat ground plane will be used
# terrain: /path/to/terrain.obj


# Notes:
# - BVH files from LAFAN1 use Y-up coordinate system (converted to Z-up automatically)
# - Bone names are extracted from the BVH hierarchy and used as target_names
# - Human height is estimated from head and foot positions across the motion
# - Position units are automatically converted from cm to meters
# - Joint orientations are world-frame wxyz quaternions, rotated along with positions
# - Standard LAFAN1 skeletons provide a fixed anatomical T-pose for calibration
# - Source contact roles and support mechanics run by default, including BVH input
# - Sole markers and thin-rod segment inertias are explicit geometric approximations
# - Unexplained mechanics protects observed contacts; it never creates contacts
# - Whole-body skin tasks report unresolved when the BVH supplies no skin surface
# - The floating base is selected/calibrated by the retargeting pipeline
