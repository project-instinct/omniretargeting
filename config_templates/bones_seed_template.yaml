# Bones-Seed (SOMA uniform) BVH Data Source Configuration Template
#
# Usage (solve + audit in one command):
#   .venv/bin/python scripts/retarget_and_audit.py --source config_templates/bones_seed_template.yaml \
#     --out /path/to/run_dir
# Or solve only:
#   .venv/bin/python -m omniretargeting.main \
#     --source-config config_templates/bones_seed_template.yaml --output output.npz
# The robot profile defaults to robot_models/unitree_g1/unitree_g1_mesh.json and the solver to fast.

# Required: Data source type
type: bones_seed

# Required: Path to Bones-Seed BVH motion file
motion: /path/to/bones_seed/motion.bvh

# Optional: Path to terrain mesh file
# terrain: /path/to/terrain.obj

