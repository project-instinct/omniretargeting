# OMOMO Data Source Configuration Template
# 
# OMOMO (Object Motion Guided Human Motion Synthesis) dataset provides
# SMPL body parameters with object 6D poses for manipulation tasks.
#
# Usage (solve + audit in one command):
#   .venv/bin/python scripts/retarget_and_audit.py --source config_templates/omomo_template.yaml \
#     --out /path/to/run_dir
# Or solve only:
#   .venv/bin/python -m omniretargeting.main \
#     --source-config config_templates/omomo_template.yaml --output output.npz
# The robot profile defaults to robot_models/unitree_g1/unitree_g1_mesh.json and the solver to fast.

# Required: Data source type
type: omomo

# Required: Path to OMOMO sequence file (.p file)
motion: /path/to/OMOMO/data/test_diffusion_manip_seq_joints24.p

# Required: Sequence index to load from the file
# Each .p file contains multiple sequences, specify which one to use
sequence_index: 318

# Optional: Root directory of OMOMO dataset (default: two levels above `motion`)
# Used to locate object meshes in data/captured_objects/
data_root: /path/to/OMOMO

# Required: Path to SMPL-X model directory
# OMOMO uses SMPL body parameters that require SMPL-X forward kinematics
# Should contain SMPLX_{gender}.pkl files
model_directory: /path/to/smplx/models

# Optional: Path to terrain mesh file
# If not specified, a flat ground plane will be used
# OMOMO sequences typically use flat ground unless captured in a specific scene
# terrain: /path/to/terrain.obj

# Optional: Number of points to sample from object mesh (default: 100)
# Higher values provide better object representation but slower optimization
# Recommended range: 50-200
n_object_samples: 100

# Optional: Framerate override (default: 30.0)
# framerate: 30.0

# Notes:
# - Object mesh is automatically loaded from: {data_root}/data/captured_objects/{object_name}_cleaned_simplified.obj
# - Object name is extracted from sequence name (e.g., "sub17_floorlamp_023" -> "floorlamp")
# - Object points are transformed to world frame using per-frame 6D poses from the sequence
# - The object mesh moves with its recorded 6D pose; contacts are kept in the object frame
